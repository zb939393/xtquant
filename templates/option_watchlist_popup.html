<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>期权自选股看盘 · 独立窗口</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css" />
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#303133;}
  #app{position:relative;height:100%;box-sizing:border-box;overflow:hidden;}
  .up{color:#e74c3c !important;font-weight:600;}
  .down{color:#27ae60 !important;font-weight:600;}
  .flat{color:#95a5a6 !important;}
  .muted{color:#909399;font-size:12px;}

  /* 顶部悬浮触发区：鼠标移到顶部才显示工具栏（默认隐藏） */
  .popup-hover{position:absolute;top:0;left:0;right:0;height:40px;z-index:5;}
  .popup-toolbar{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 12px;background:#fff;border:1px solid #ebeef5;border-radius:0 0 8px 8px;box-shadow:0 2px 8px rgba(0,0,0,.1);opacity:0;pointer-events:none;transition:opacity .18s ease;}
  .popup-hover:hover + .popup-toolbar, .popup-toolbar:hover{opacity:1;pointer-events:auto;}
  .popup-title{font-size:15px;font-weight:700;color:#303133;white-space:nowrap;}
  .popup-toolbar .muted{font-size:12px;color:#909399;white-space:nowrap;}
  .popup-toolbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .zoom-group{display:flex;align-items:center;gap:6px;}
  .zoom-group label{font-size:12px;color:#909399;white-space:nowrap;}
  .zoom-slider{width:80px;}
  .zoom-val{font-size:12px;color:#606266;min-width:34px;text-align:right;}

  .popup-board{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill, minmax(min(100%, var(--card-min, 380px)), 1fr));gap:8px;padding:8px;align-content:start;}
  .cell{min-width:0;min-height:340px;height:340px;background:#fff;border:1px solid #ebeef5;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.03);display:flex;flex-direction:column;}
  .cell-head{display:flex;align-items:center;flex-wrap:wrap;gap:3px 6px;padding:calc(2px*var(--zoom,1)) calc(8px*var(--zoom,1));min-height:calc(20px*var(--zoom,1));background:#fafbfc;border-bottom:1px solid #f0f2f5;}
  .board-badge{font-weight:700;font-size:calc(10px*var(--zoom,1));padding:0 6px;border-radius:8px;background:#f0f2f5;color:#606266;line-height:16px;}
  .board-name{font-weight:700;font-size:calc(11px*var(--zoom,1));color:#303133;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42%;}
  .board-expired-tag{font-size:10px;font-weight:700;color:#fff;background:#c0c4cc;padding:0 7px;border-radius:9px;}
  .board-chart-spacer{flex:1 1 auto;}
  .board-chg,.board-chg-pct{font-weight:700;font-variant-numeric:tabular-nums;font-size:calc(12px*var(--zoom,1));}
  .board-chg-pct{margin-left:1px;}
  .cell-body{flex:1 1 auto;min-height:0;position:relative;}

  .board-expired-panel{display:flex;align-items:center;justify-content:center;height:100%;font-size:13px;text-align:center;padding:0 12px;}

  /* ===== 分时图 + 五档盘口 + 逐笔成交（与 option.html board-rt 同款视觉，支持 --zoom 缩放） ===== */
  .board-rt{ width:100%; height:100%; display:flex; flex-direction:row; gap:calc(6px*var(--zoom,1)); position:relative; }
  .board-rt-chart{ flex:3 1 0; min-width:0; height:100%; cursor:pointer; position:relative; }
  .board-rt-side{ flex:1 1 0; min-width:0; height:100%; display:flex; flex-direction:column; gap:calc(4px*var(--zoom,1)); }
  .board-rt-book, .board-rt-ticks{ min-width:0; border:1px solid #eef0f3; border-radius:6px; padding:1px 3px; overflow:hidden; }
  .board-rt-book{ flex:0 0 auto; }
  .board-rt-ticks{ flex:1 1 auto; }
  .book-head, .tick-head{ font-size:calc(9px*var(--zoom,1)); color:#909399; font-weight:600; line-height:12px; border-bottom:1px solid #f2f4f7; margin-bottom:1px; }
  .book-row{ display:flex; align-items:center; gap:1px; font-size:calc(9px*var(--zoom,1)); line-height:11px; font-variant-numeric:tabular-nums; }
  .book-tag{ flex:0 0 calc(16px*var(--zoom,1)); color:#909399; }
  .book-price{ flex:1 1 auto; text-align:right; }
  .book-vol{ flex:0 0 calc(34px*var(--zoom,1)); text-align:right; color:#909399; }
  .book-row.ask .book-price{ color:#27ae60; }
  .book-row.bid .book-price{ color:#e74c3c; }
  .book-mid{ display:flex; align-items:center; justify-content:space-between; border-top:1px dashed #e9ebee; border-bottom:1px dashed #e9ebee; margin:2px 0; padding:1px 0; }
  .book-last{ font-size:calc(12px*var(--zoom,1)); font-weight:700; font-variant-numeric:tabular-nums; }
  .book-last.up{ color:#e74c3c; } .book-last.down{ color:#27ae60; } .book-last.flat{ color:#303133; }
  .book-time{ font-size:calc(9px*var(--zoom,1)); color:#c0c4cc; }
  .tick-row{ display:flex; align-items:center; gap:1px; font-size:calc(9px*var(--zoom,1)); line-height:11px; font-variant-numeric:tabular-nums; }
  .tick-time{ flex:0 0 calc(36px*var(--zoom,1)); color:#909399; }
  .tick-price{ flex:1 1 auto; text-align:right; }
  .tick-price.buy{ color:#e74c3c; } .tick-price.sell{ color:#27ae60; } .tick-price.neutral{ color:#606266; }
  .tick-vol{ flex:0 0 calc(34px*var(--zoom,1)); text-align:right; color:#909399; }
</style>
</head>
<body>
<div id="app">
  <div class="popup-hover"></div>
  <div class="popup-toolbar">
    <span class="popup-title">📈 期权自选股看盘 · 独立窗口</span>
    <span class="muted">分时图（实时）· 五档盘口 · 逐笔成交（扩展行情 pytdx · 红涨绿跌）</span>
    <span class="popup-toolbar-right">
      <span class="muted" v-if="statusMsg">[# statusMsg #]</span>
      <span class="muted">快照 [# updatedAt #]</span>
      <span class="zoom-group">
        <label>大小</label>
        <input type="range" class="zoom-slider" min="50" max="150" step="1" v-model.number="zoom" @input="onZoomChange">
        <span class="zoom-val">[# zoom #]%</span>
      </span>
      <el-switch v-model="showBands" size="mini" active-text="±σ通道"></el-switch>
      <el-switch v-model="showSide" size="mini" active-text="盘口"></el-switch>
      <el-switch v-model="onTop" size="mini" active-text="置顶" @change="onTopChange"></el-switch>
      <el-button type="primary" size="mini" icon="el-icon-refresh" :loading="loading" @click="reload(true)">刷新</el-button>
      <el-button type="primary" size="mini" icon="el-icon-close" @click="closeWin">关闭</el-button>
    </span>
  </div>

  <div class="popup-board">
    <div v-if="!rows.length" class="board-empty" style="grid-column:1/-1;text-align:center;color:#909399;padding:60px 0;font-size:14px;">
      暂无自选期权，请先在期权看板中列表左侧 ☆ 星标加入，或在「只看自选」筛选下点击 ★ 添加。
    </div>
    <div class="cell" v-for="row in rows" :key="row.code">
      <div class="cell-head">
        <span class="board-badge" :class="updownCls(row.change_pct)" v-text="row.code"></span>
        <span class="board-name" :title="row.contract_name" v-text="row.contract_name || row.code"></span>
        <span v-if="row.expired" class="board-expired-tag">已到期</span>
        <span class="board-chart-spacer"></span>
        <template v-if="!row.expired">
          <span class="board-chg" :class="updownCls(row.change_pct)" v-text="fmtNum(num(row.last) - num(row.preclose), 4)"></span>
          <span class="board-chg-pct" :class="updownCls(row.change_pct)" v-text="fmtPct(row.change_pct, 2, true)"></span>
        </template>
        <span v-else class="board-chg-pct muted">无行情</span>
      </div>
      <div class="cell-body">
        <opt-board-rt v-if="!row.expired" :code="row.code" :prev-close="num(row.preclose)" :price="num(row.last)" :chg-pct="num(row.change_pct)" :delta="num(row.delta)" kind="option" :show-book="showSide" :show-ticks="showSide" :show-bands="showBands"></opt-board-rt>
        <div v-else class="board-expired-panel muted">该合约已到期/已下市，暂无实时行情</div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/vue@2.7.16/dist/vue.min.js"></script>
<script src="https://unpkg.com/element-ui/lib/index.js"></script>
<script src="https://unpkg.com/echarts@5.5.0/dist/echarts.min.js"></script>
<script>
// ===== 行情请求调度器：并发上限 + 请求去重 + 超时（与 option.html 看盘板一致） =====
(function(){
  const MAX = 6;
  const TIMEOUT = 12000;
  const _inflight = new Set();
  const _pending = [];
  const _inFlightP = new Map();
  function _pump(){
    while(_inflight.size < MAX && _pending.length){
      const job = _pending.shift();
      _inflight.add(job.key);
      let ctrl = null;
      if(typeof AbortController !== 'undefined'){ try{ ctrl = new AbortController(); }catch(e){ ctrl = null; } }
      const opts = Object.assign({}, job.opts || {});
      if(ctrl) opts.signal = ctrl.signal;
      const timer = setTimeout(() => { if(ctrl){ try{ ctrl.abort(); }catch(e){} } }, TIMEOUT);
      fetch(job.url, opts).then(async (res) => {
        let body;
        try{ body = await res.json(); }
        catch(e1){ try{ const t = await res.text(); body = t ? { _text: t } : null; }catch(e2){ body = null; } }
        if(!res.ok) throw new Error('HTTP ' + res.status);
        return body;
      }).then((body) => {
        clearTimeout(timer);
        _inFlightP.delete(job.key);
        _inflight.delete(job.key);
        job.resolve(body);
        _pump();
      }).catch((err) => {
        clearTimeout(timer);
        _inFlightP.delete(job.key);
        _inflight.delete(job.key);
        job.reject(err);
        _pump();
      });
    }
  }
  window.reqJSON = function(url, opts){
    if(_inFlightP.has(url)) return _inFlightP.get(url);
    const p = new Promise((resolve, reject) => {
      _pending.push({ key: url, url: url, opts: opts, resolve: resolve, reject: reject });
      _pump();
    });
    _inFlightP.set(url, p);
    p.finally(() => { if(_inFlightP.get(url) === p) _inFlightP.delete(url); });
    return p;
  };
})();

function num(v){ if(v===null||v===undefined||v==='') return NaN; const n=parseFloat(v); return isNaN(n)?NaN:n; }
function fmtNum(v,d=2){ const n=num(v); return isNaN(n)?'--':(n.toFixed(d)); }
function fmtPct(v,d=2,signed=false){ const n=num(v); if(isNaN(n)) return '--'; const s=n.toFixed(d)+'%'; return signed&&n>0?('+'+s):s; }
function fmtWan(v,d=0){ const n=num(v); if(isNaN(n)) return '--'; if(Math.abs(n)>=1e8) return (n/1e8).toFixed(2)+'亿'; if(Math.abs(n)>=1e4) return (n/1e4).toFixed(d)+'万'; return n.toFixed(d); }
function fmtAvgVol(v){ const n=num(v); if(isNaN(n)) return '--'; if(Math.abs(n)>=1e4) return fmtWan(n); if(n>=10) return Math.round(n).toString(); return n.toFixed(1); }
function rtOpenMinutes(t){ if(!t || typeof t !== 'string') return 0; const p = t.split(':'); if(p.length < 2) return 0; const h = parseInt(p[0], 10), m = parseInt(p[1], 10); if(isNaN(h) || isNaN(m)) return 0; if(h < 9 || (h === 9 && m < 30)) return 1; if(h < 11 || (h === 11 && m <= 30)) return Math.max(1, (h - 9) * 60 + (m - 30)); if(h < 13) return 120; return Math.max(1, 120 + (h - 13) * 60 + m); }

function rtSessionAxis(){
  const session = [];
  const pushRange = function(h0, m0, h1, m1){
    for(let h = h0; h <= h1; h++){
      for(let m = 0; m < 60; m++){
        if((h === h0 && m < m0) || (h === h1 && m > m1)) continue;
        session.push(('0' + h).slice(-2) + ':' + ('0' + m).slice(-2));
      }
    }
  };
  pushRange(9, 30, 11, 30);
  pushRange(13, 0, 15, 0);
  return session;
}
function rtMapToSession(session, data){
  const idxOf = {};
  session.forEach(function(t, i){ idxOf[t] = i; });
  const prices = new Array(session.length).fill(null);
  const avgs = new Array(session.length).fill(null);
  const vols = new Array(session.length).fill(null);
  (data || []).forEach(function(d){
    const i = idxOf[d.time];
    if(i === undefined) return;
    prices[i] = Number(d.price);
    avgs[i] = Number(d.avg_price);
    vols[i] = Number(d.vol);
  });
  return { prices: prices, avgs: avgs, vols: vols };
}
function buildRtOption(data, prevClose, kind, avgVolPerMin, delta, showBands){
  const session = rtSessionAxis();
  const mapped = rtMapToSession(session, data);
  const prices = mapped.prices, avgs = mapped.avgs, vols = mapped.vols;
  let last = 0;
  for(let i = prices.length - 1; i >= 0; i--){ if(prices[i] != null && isFinite(prices[i])){ last = prices[i]; break; } }
  // VWAP 偏离度：累计加权均价偏离 = (价 - VWAP) / VWAP * 100%
  const vwapDev = new Array(prices.length).fill(null);
  let _cv = 0, _cvp = 0;
  for(let i = 0; i < prices.length; i++){
    const p = prices[i], v = vols[i];
    if(p != null && isFinite(p) && v != null && isFinite(v) && v > 0){
      _cv += p * v; _cvp += v;
      if(_cvp > 0){ const vw = _cv / _cvp; vwapDev[i] = (p - vw) / vw * 100; }
    }
  }
  let lastDev = null;
  for(let i = vwapDev.length - 1; i >= 0; i--){ if(vwapDev[i] != null && isFinite(vwapDev[i])){ lastDev = vwapDev[i]; break; } }
  // 标准差通道：以 VWAP(均线 avgs) 为中轴，±1σ / ±2σ 通道带
  let _sigma = 0;
  {
    let _s = 0, _n = 0;
    for(let i = 0; i < prices.length; i++){
      const p = prices[i], a = avgs[i];
      if(p != null && isFinite(p) && a != null && isFinite(a)){ const d = p - a; _s += d * d; _n++; }
    }
    _sigma = _n > 0 ? Math.sqrt(_s / _n) : 0;
  }
  const up1 = [], dn1 = [], up2 = [], dn2 = [], band1 = [], band2 = [];
  for(let i = 0; i < prices.length; i++){
    const a = avgs[i];
    if(a != null && isFinite(a)){
      up1.push(a + _sigma); dn1.push(a - _sigma);
      up2.push(a + 2 * _sigma); dn2.push(a - 2 * _sigma);
      band1.push(2 * _sigma); band2.push(4 * _sigma);
    } else {
      up1.push(null); dn1.push(null); up2.push(null); dn2.push(null); band1.push(null); band2.push(null);
    }
  }
  const up = prevClose > 0 ? (last >= prevClose) : true;
  const upColor = '#e74c3c', downColor = '#27ae60';
  const color = kind === 'stock' ? '#409EFF' : (up ? upColor : downColor);
  const hasPrev = prevClose && isFinite(prevClose) && prevClose > 0;
  let ext = 0;
  if(hasPrev){
    let dmax = 0;
    prices.forEach(function(p){ if(p != null && isFinite(p)){ const dev = Math.abs(p - prevClose) / prevClose; if(dev > dmax) dmax = dev; } });
    if(dmax < 0.005) dmax = 0.005;
    ext = dmax * 1.08;
  }
  const leftMin = hasPrev ? prevClose * (1 - ext) : undefined;
  const leftMax = hasPrev ? prevClose * (1 + ext) : undefined;
  let _devMax = ext * 100;
  vwapDev.forEach(function(d){ if(d != null && isFinite(d)){ const a = Math.abs(d); if(a > _devMax) _devMax = a; } });
  if(_devMax < 0.01) _devMax = 0.01;
  const vwapMin = hasPrev ? -_devMax * 1.08 : undefined;
  const vwapMax = hasPrev ? _devMax * 1.08 : undefined;
  const rightMin = hasPrev ? -ext * 100 : undefined;
  const rightMax = hasPrev ? ext * 100 : undefined;
  const volColors = prices.map(function(p, i){
    const base = i === 0 ? prevClose : (prices[i - 1] != null ? prices[i - 1] : prevClose);
    return (p >= base) ? upColor : downColor;
  });
  return {
    backgroundColor: '#fff',
    animation: false,
    title: { show: avgVolPerMin > 0 || (lastDev != null && isFinite(lastDev)) || (isFinite(num(delta)) && num(delta) !== 0), text: '均量/分 ' + fmtAvgVol(num(avgVolPerMin)) + (isFinite(num(delta)) && num(delta) !== 0 ? '　Δ ' + fmtNum(num(delta), 4) : '') + (lastDev != null && isFinite(lastDev) ? '　VWAP偏离 ' + fmtPct(num(lastDev), 2, true) : ''), left: 4, top: 3, textStyle: { fontSize: 11, color: '#909399', fontWeight: 'normal' } },
    grid: [{ left: 46, right: hasPrev ? 40 : 12, top: 22, height: '56%' }, { left: 46, right: hasPrev ? 40 : 12, top: '80%', height: '16%' }],
    tooltip: { trigger: 'axis', axisPointer: { type: 'line' }, formatter: function(params){
        if(!params || !params.length) return '';
        const idx = params[0].dataIndex;
        const t = session[idx];
        const p = prices[idx], a = avgs[idx], v = vols[idx];
        let cum = 0; for(let k = 0; k <= idx; k++){ if(vols[k] != null) cum += vols[k]; }
        const avg = rtOpenMinutes(t) > 0 ? (cum / rtOpenMinutes(t)) : null;
        let s = '<div style="font-size:11px;margin-bottom:2px;">' + (t || '') + '</div>';
        s += '价 ' + (p != null ? fmtNum(p, 4) : '--') + '　均 ' + (a != null ? fmtNum(a, 4) : '--') + '<br/>';
        s += 'VWAP偏离 ' + (vwapDev[idx] != null ? fmtPct(vwapDev[idx], 2, true) : '--') + '<br/>';
        s += '量(累计) ' + (v != null ? fmtWan(v) : '--') + '　均量/分 ' + (avg != null ? fmtAvgVol(avg) : '--');
        return s;
      } },
    xAxis: [
      { type: 'category', data: session, boundaryGap: false, axisLabel: { show: false }, axisLine: { lineStyle: { color: '#dcdfe6' } } },
      { type: 'category', gridIndex: 1, data: session, boundaryGap: false, axisLabel: { show: false } }
    ],
    yAxis: [
      { type: 'value', min: leftMin, max: leftMax, scale: true, splitLine: { lineStyle: { color: '#f2f2f2' } }, axisLabel: { color: '#909399', fontSize: 9 } },
      { gridIndex: 1, type: 'value', scale: true, splitLine: { show: false }, axisLabel: { show: false } },
      { gridIndex: 0, position: 'right', type: 'value', min: rightMin, max: rightMax, scale: true, splitLine: { show: false }, name: '幅度%', nameLocation: 'end', nameGap: 2, nameTextStyle: { fontSize: 9, color: '#909399' },
        axisLabel: { color: function(v){ return v > 0 ? '#e74c3c' : (v < 0 ? '#27ae60' : '#909399'); }, fontSize: 9, formatter: function(v){ return (hasPrev ? fmtPct(v, 2, true) : fmtNum(v, 2)); } } },
      { gridIndex: 0, type: 'value', min: vwapMin, max: vwapMax, scale: true, show: false, axisLabel: { show: false }, splitLine: { show: false }, axisPointer: { show: false } }
    ],
    series: [
      ...(showBands ? [
      // 标准差通道带（以 VWAP/均线 为中轴）：±2σ 外侧视为极端偏离，回归概率增大
      { name: 'σ带2下', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: dn2, showSymbol: false, smooth: false, connectNulls: true, stack: 'b2', lineStyle: { opacity: 0 }, areaStyle: { opacity: 0 }, silent: true, z: 1 },
      { name: 'σ带2', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: band2, showSymbol: false, smooth: false, connectNulls: true, stack: 'b2', lineStyle: { opacity: 0 }, areaStyle: { color: 'rgba(230,162,60,0.07)' }, silent: true, z: 1 },
      { name: 'σ带1下', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: dn1, showSymbol: false, smooth: false, connectNulls: true, stack: 'b1', lineStyle: { opacity: 0 }, areaStyle: { opacity: 0 }, silent: true, z: 1 },
      { name: 'σ带1', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: band1, showSymbol: false, smooth: false, connectNulls: true, stack: 'b1', lineStyle: { opacity: 0 }, areaStyle: { color: 'rgba(64,158,255,0.10)' }, silent: true, z: 1 },
      { name: '±2σ', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: up2, showSymbol: false, smooth: false, connectNulls: true, lineStyle: { color: 'rgba(230,162,60,0.6)', width: 1, type: 'dashed' }, silent: true, z: 2 },
      { name: '∓2σ', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: dn2, showSymbol: false, smooth: false, connectNulls: true, lineStyle: { color: 'rgba(230,162,60,0.6)', width: 1, type: 'dashed' }, silent: true, z: 2 },
      { name: '±1σ', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: up1, showSymbol: false, smooth: false, connectNulls: true, lineStyle: { color: 'rgba(64,158,255,0.5)', width: 1 }, silent: true, z: 2 },
      { name: '∓1σ', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: dn1, showSymbol: false, smooth: false, connectNulls: true, lineStyle: { color: 'rgba(64,158,255,0.5)', width: 1 }, silent: true, z: 2 }
      ] : []),
      { name: '价', type: 'line', data: prices, showSymbol: false, smooth: false, connectNulls: true, z: 5,
        lineStyle: { width: 1.2, color: color },
        areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: up ? 'rgba(231,76,60,0.25)' : 'rgba(39,174,96,0.25)' },
          { offset: 1, color: 'rgba(255,255,255,0)' } ]) },
        markLine: { silent: true, symbol: 'none', lineStyle: { color: '#c0c4cc', type: 'dashed', width: 1 },
          data: [{ yAxis: prevClose }], label: { formatter: hasPrev ? ('昨收 ' + fmtNum(prevClose, 4)) : '', fontSize: 9, color: '#909399' } } },
      { name: '均', type: 'line', data: avgs, showSymbol: false, smooth: false, connectNulls: true, z: 4, lineStyle: { width: 1, color: '#f5a623' } },
      { name: 'VWAP偏离', type: 'bar', xAxisIndex: 0, yAxisIndex: 3, data: vwapDev, connectNulls: true, barWidth: '50%', z: 3,
        itemStyle: { color: function(p){ const v = p.data; return (v > 0) ? 'rgba(231,76,60,0.35)' : (v < 0 ? 'rgba(39,174,96,0.35)' : 'rgba(192,196,204,0.3)'); } } },
      { name: '量', type: 'bar', xAxisIndex: 1, yAxisIndex: 1, data: vols,
        itemStyle: { color: function(p){ return volColors[p.dataIndex] || upColor; } } }
    ]
  };
}

// ===== 期权自选股看盘·单卡片：分时图（实时） + 五档盘口 + 逐笔成交 =====
// 与 option.html 的 opt-board-rt 完全同款视觉与交互，仅数据源切到 /option/exquote/minute|quote|tick。
Vue.component('opt-board-rt', {
  props: {
      code: { type: String, default: '' },
      prevClose: { type: Number, default: 0 },
      price: { type: Number, default: 0 },
      chgPct: { type: Number, default: 0 },
      delta: { type: Number, default: 0 },
      kind: { type: String, default: '' },
      showBook: { type: Boolean, default: true },
      showTicks: { type: Boolean, default: true },
      showBands: { type: Boolean, default: true },
    },
  data(){ return { src: '', quote: {}, ticks: [], avgVolPerMin: 0, _timer: null, _rt: null, _visible: false, _io: null, _ro: null }; },
  computed: {
    asksRev(){
      const a = (this.quote && this.quote.asks) || [];
      return a.slice().reverse();
    },
    ticksView(){
      return (this.ticks || []).slice().reverse().slice(0, 13);
    },
    showSide(){
      return (this.showBook || this.showTicks) && this.quote && this.quote.bids && this.quote.bids.length;
    }
  },
  watch: {
    showBook(){ this._resizeChart(); },
    showTicks(){ this._resizeChart(); },
    showSide(){ this._resizeChart(); },
    showBands(){ this._redraw(); }
  },
  mounted(){
    this._setupIO();
    if(typeof ResizeObserver !== 'undefined'){
      const el = this.$refs.chart;
      if(el){
        this._ro = new ResizeObserver(() => {
          if(this._chart){ try{ this._chart.resize(); }catch(e){} }
        });
        this._ro.observe(el);
      }
    }
  },
  beforeDestroy(){
    if(this._io){ try{ this._io.disconnect(); }catch(e){} this._io = null; }
    if(this._timer){ clearInterval(this._timer); this._timer = null; }
    if(this._ro){ try{ this._ro.disconnect(); }catch(e){} this._ro = null; }
    if(this._chart){ try{ this._chart.dispose(); }catch(e){} this._chart = null; }
  },
  methods: {
    _setupIO(){
      const start = () => { if(!this._timer){ this._timer = setInterval(() => this._refresh(), 3000); this._refresh(); } };
      const stop = () => { if(this._timer){ clearInterval(this._timer); this._timer = null; } };
      if(typeof IntersectionObserver === 'undefined'){ start(); return; }
      this._io = new IntersectionObserver((entries) => {
        const e = entries[0];
        if(e.isIntersecting){
          if(!this._visible){ this._visible = true; start(); }
        } else {
          this._visible = false;
          stop();
        }
      }, { root: null, threshold: 0.01 });
      this._io.observe(this.$el);
    },
    _resizeChart(){
      if(!this._chart) return;
      const doR = () => { try{ this._chart.resize(); }catch(e){} };
      this.$nextTick(doR);
      if(typeof requestAnimationFrame !== 'undefined'){
        requestAnimationFrame(() => this.$nextTick(doR));
      }
    },
    _fmtP(v){ return fmtNum(num(v), 4); },
    _fmtVol(v){ return fmtWan(v, 0); },
    _updown(price, base){ const n = num(price), b = num(base); if(isNaN(n) || isNaN(b)) return ''; return n > b ? 'up' : (n < b ? 'down' : 'flat'); },
    _tickCls(t){ return t === 0 ? 'buy' : (t === 1 ? 'sell' : 'neutral'); },
    _refresh(){
      if(!this.code) return;
      this._drawChart();
      this._refreshLive();
    },
    _refreshLive(){
      if(!this.code) return;
      this._loadQuote();
      this._loadTicks();
    },
    async _drawChart(){
      try{
        const js = await reqJSON('/option/exquote/minute/' + encodeURIComponent(this.code) + '?ttl=10&_=' + Date.now(), { cache: 'no-store' });
        const data = (js && js.data) || [];
        this.src = (js && js.src) || (js && js.ok ? 'ok' : '');
        if(!data.length){ if(this._chart){ try{ this._chart.clear(); }catch(_){} } return; }
        this._rt = data;
        let avg = 0;
        let total = 0;
        data.forEach(function(d){ const v = Number(d.vol); if(isFinite(v)) total += v; });
        let mins = rtOpenMinutes((this.quote && this.quote.servertime) || '');
        if(!mins){
          const bars = data.filter(function(d){ const v = Number(d.vol); return isFinite(v) && v > 0; });
          if(bars.length) mins = rtOpenMinutes(bars[bars.length - 1].time);
        }
        if(mins > 0) avg = total / mins;
        this.avgVolPerMin = avg;
        if(!this._chart){
          const el = this.$refs.chart;
          if(!el) return;
          try{ this._chart = echarts.init(el); }catch(e){ return; }
          try{ this._chart.resize(); }catch(e){}
        }
        this._redraw();
      }catch(e){
        this.src = 'err';
      }
    },
    _calcPrevClose(){
      let pc = Number(this.prevClose) || 0;
      if(!pc){
        const p = num(this.price), c = num(this.chgPct);
        if(isFinite(p) && p > 0 && isFinite(c)) pc = p / (1 + c / 100);
      }
      if(!pc){ const lc = Number(this.quote && this.quote.last_close) || 0; pc = lc; }
      return pc;
    },
    _redraw(){
      if(!this._chart || !this._rt) return;
      const pc = this._calcPrevClose();
      this._chart.setOption(buildRtOption(this._rt, pc, this.kind, this.avgVolPerMin, this.delta, this.showBands), true);
      this._chart.resize();
    },
    async _loadQuote(){
      try{
        const dj = await reqJSON('/option/exquote/quote/' + encodeURIComponent(this.code) + '?ttl=3&_=' + Date.now(), { cache: 'no-store' });
        this.quote = (dj && dj.data) || {};
        if(this._chart){
          this.$nextTick(() => { try{ this._chart.resize(); }catch(e){} });
        }
        if(!Number(this.prevClose)){
          this._redraw();
        }
      }catch(e){}
    },
    async _loadTicks(){
      try{
        const tj = await reqJSON('/option/exquote/tick/' + encodeURIComponent(this.code) + '?count=40&ttl=3&_=' + Date.now(), { cache: 'no-store' });
        this.ticks = (tj && tj.data) || [];
      }catch(e){}
    },
    async copyCode(){
      const code = this.code;
      if(!code) return;
      const clip = async () => {
        if(navigator.clipboard && navigator.clipboard.writeText){
          await navigator.clipboard.writeText(code);
          return true;
        }
        return false;
      };
      const legacy = () => {
        try{
          const ta = document.createElement('textarea');
          ta.value = code;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '-1000px';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        }catch(e){ return false; }
      };
      let ok = false;
      try{ ok = await clip(); }catch(e){ ok = false; }
      if(!ok) ok = legacy();
      if(ok){
        if(this.$message && this.$message.success) this.$message.success('已复制期权代码：' + code);
      } else {
        if(this.$message && this.$message.warning) this.$message.warning('复制失败，期权代码：' + code);
      }
    }
  },
  template:
    '<div class="board-rt">' +
      '<div class="board-rt-chart" ref="chart" title="点击复制期权代码" @click="copyCode"></div>' +
      '<div class="board-rt-side" v-show="showSide">' +
        '<div class="board-rt-book" v-show="showBook">' +
          '<div class="book-head">五档买卖盘</div>' +
          '<div class="book-row ask" v-for="(a,i) in asksRev" :key="\'a\'+i">' +
            '<span class="book-tag" v-text="\'卖\'+(5-i)"></span>' +
            '<span class="book-price" v-text="_fmtP(a[0])"></span>' +
            '<span class="book-vol" v-text="_fmtVol(a[1])"></span>' +
          '</div>' +
          '<div class="book-mid">' +
            '<span class="book-last" :class="_updown(quote.price, quote.last_close)" v-text="_fmtP(quote.price)"></span>' +
            '<span class="book-time" v-text="quote.servertime"></span>' +
          '</div>' +
          '<div class="book-row bid" v-for="(b,i) in quote.bids" :key="\'b\'+i">' +
            '<span class="book-tag" v-text="\'买\'+(i+1)"></span>' +
            '<span class="book-price" v-text="_fmtP(b[0])"></span>' +
            '<span class="book-vol" v-text="_fmtVol(b[1])"></span>' +
          '</div>' +
        '</div>' +
        '<div class="board-rt-ticks" v-show="showTicks">' +
          '<div class="tick-head">详细成交</div>' +
          '<div class="tick-row" v-for="(t,i) in ticksView" :key="i">' +
            '<span class="tick-time" v-text="t.time"></span>' +
            '<span class="tick-price" :class="_tickCls(t.buyorsell)" v-text="_fmtP(t.price)"></span>' +
            '<span class="tick-vol" v-text="_fmtVol(t.vol)"></span>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>'
});

const OPT_WATCH_ORDER_KEY = 'option_watch_order_v1';

new Vue({
  el: '#app',
  delimiters: ['[#', '#]'],
  data() {
    return {
      loading: false,
      statusMsg: '',
      rows: [],
      updatedAt: '',
      refreshInterval: 5000,
      timer: null,
      showBands: true,
      showSide: true,
      onTop: true,
      zoom: (function(){ try{ var v = parseInt(localStorage.getItem('zoom_option_wl') || '100', 10); return (isFinite(v) && v >= 50 && v <= 150) ? v : 100; }catch(e){ return 100; } })(),
    };
  },
  methods: {
    updownCls(v) {
      const n = num(v);
      if (isNaN(n)) return '';
      return n > 0 ? 'up' : (n < 0 ? 'down' : 'flat');
    },
    _reconcileWatchCodes(serverCodes) {
      let local = [];
      try {
        const raw = localStorage.getItem(OPT_WATCH_ORDER_KEY);
        if (raw) { const arr = JSON.parse(raw); if (Array.isArray(arr)) local = arr.filter(x => !!x); }
      } catch (e) {}
      const inWatch = new Set(serverCodes);
      const kept = local.filter(c => inWatch.has(c));
      const seen = new Set(kept);
      serverCodes.forEach(c => { if (!seen.has(c)) { kept.push(c); seen.add(c); } });
      return kept;
    },
    loadWatchlist() {
      return fetch('/option/watchlist', {cache:'no-store'})
        .then(r => r.json())
        .then(resp => {
          if (!resp.ok) return [];
          return this._reconcileWatchCodes((resp.codes || []));
        })
        .catch(() => []);
    },
    async reload(force) {
      if (force) { this.loading = true; this.statusMsg = ''; }
      try {
        const codes = await this.loadWatchlist();
        if (!codes.length) {
          this.rows = [];
          this.updatedAt = new Date().toLocaleTimeString('zh-CN', {hour12:false});
          this.statusMsg = '';
          return;
        }
        const qs = 'code_in=' + encodeURIComponent(codes.join(',')) + '&limit=0' + (force ? '&force=1' : '');
        const resp = await fetch('/option/full?' + qs, {cache:'no-store'}).then(r => r.json());
        if (!resp.ok) throw new Error(resp.error || 'backend error');
        const byCode = {};
        (resp.data || []).forEach(r => { if (r && r.code != null) byCode[String(r.code).toUpperCase()] = r; });
        // 按自选顺序聚合行情；不在全量快照中的（已到期/下市）标记为无行情
        this.rows = codes.map(code => {
          const rec = byCode[String(code).toUpperCase()];
          if (rec) return rec;
          return { code: code, expired: true, contract_name: '', last: '', preclose: '', change_pct: '', delta: '' };
        });
        this.statusMsg = '';
        this.updatedAt = new Date().toLocaleTimeString('zh-CN', {hour12:false});
      } catch (err) {
        this.statusMsg = '自选股行情加载失败：' + err.message;
      } finally {
        this.loading = false;
      }
    },
    onZoomChange() {
      document.documentElement.style.setProperty('--zoom', this.zoom / 100);
      try { localStorage.setItem('zoom_option_wl', this.zoom); } catch(e){}
    },
    applyRefreshInterval() {
      if (this.timer) { clearInterval(this.timer); this.timer = null; }
      if (this.refreshInterval && this.refreshInterval > 0) {
        this.timer = setInterval(() => this.reload(false), this.refreshInterval);
      }
    },
    onTopChange(v) {
      if (window.pywebview && window.pywebview.api && window.pywebview.api.set_on_top) {
        window.pywebview.api.set_on_top(!!v);
      } else {
        if (this.$message && this.$message.warning) this.$message.warning('仅独立窗口可切换置顶');
        this.onTop = true;
      }
    },
    closeWin() { try { window.close(); } catch(e){} },
  },
  created() {
    document.documentElement.style.setProperty('--zoom', this.zoom / 100);
  },
  mounted() {
    this.reload(true).then(() => this.applyRefreshInterval());
  },
  beforeDestroy() {
    if (this.timer) clearInterval(this.timer);
  },
});
</script>
