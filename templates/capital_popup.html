<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股指资金</title>
<script src="/static/jquery.min.js"></script>
<script src="/static/echarts.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { font-family:"Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#f5f7fa; color:#303133; overflow:hidden; }
  #app { position:relative; height:100%; }
  .tb-hover { position:absolute; top:0; left:0; right:0; height:46px; z-index:5; }
  .toolbar { position:absolute; top:0; left:0; right:0; z-index:10; display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 16px; background:rgba(255,255,255,.92); opacity:0; pointer-events:none; transition:opacity .18s ease; border-bottom:1px solid #f2f3f5; }
  .tb-hover:hover + .toolbar, .toolbar:hover { opacity:1; pointer-events:auto; }
  .title { font-weight:700; font-size:13px; }
  .title .sub { font-size:10px; font-weight:400; color:#909399; margin-left:6px; }
  .updated { margin-left:auto; font-size:10px; color:#909399; }
  .btn { background:#fff; color:#409eff; border:1px solid #409eff; border-radius:6px; padding:3px 8px; font-size:10px; cursor:pointer; }
  .btn:hover { background:#ecf5ff; }
  .btn.active { background:#409eff; color:#fff; }
  .zoom-group { display:flex; align-items:center; gap:6px; }
  .zoom-group label { font-size:12px; color:#909399; }
  .zoom-slider { width:80px; }
  .zoom-val { font-size:12px; color:#606266; min-width:34px; text-align:right; }
  .charts { position:absolute; inset:0; display:flex; flex-direction:row; flex-wrap:wrap; align-content:flex-start; align-items:flex-start; gap:0; padding:6px 8px; overflow:auto; }
  #main, #main1 { flex:1 1 320px; min-width:0; min-height:0; aspect-ratio:calc(5 / (var(--zoom, 1) * 3)); }
</style>
</head>
<body>
<div id="app">
  <div class="tb-hover"></div>
  <div class="toolbar">
    <span class="title">股指<span class="sub">期指行情 / 资金流</span></span>
    <span class="updated" id="updated"></span>
    <div class="zoom-group">
      <label>大小</label>
      <input type="range" class="zoom-slider" id="zoomSlider" min="50" max="150" step="1" value="100" oninput="onZoomChange()">
      <span class="zoom-val" id="zoomVal">100%</span>
    </div>
    <button class="btn active" id="topBtn" onclick="toggleTop()">置顶</button>
    <button class="btn" id="refreshBtn" onclick="manualRefresh()">刷新</button>
  </div>
  <div class="charts">
    <div id="main"></div>
    <div id="main1"></div>
  </div>
</div>

<script>
// ===== 通用 tooltip 数值格式化（保留2位小数，去除尾部0）=====
function fmtTip(v){
  if(v == null) return '--';
  if(Array.isArray(v)) return v.map(fmtTip).join('  ');
  const n = Number(v);
  if(!isFinite(n)) return String(v);
  return parseFloat(n.toFixed(2)).toString();
}
// ===== 全局状态 =====
var onTop = true;
var timer = null;
var chartS = null;   // 期指行情 图表实例
var chartF = null;   // 资金 图表实例

// 资金图数据缓存：东方财富 fflow 接口偶发返回空（限流/超时/502），
// 若空数据直接重绘会把线条清空 → 表现为「一会有一会无」。
// 缓存最近一次成功的四条合约分时序列，遇到空数据时用缓存兜底，保持线条稳定。
var _capCache = { day: "", p: [null, null, null, null], names: [null, null, null, null], codes: [null, null, null, null] };

// ===== 内容大小缩放 =====
var zoom = 100;
try { var _zs = parseInt(localStorage.getItem("zoom_capital") || "100", 10); if(isFinite(_zs) && _zs >= 50 && _zs <= 150) zoom = _zs; } catch(e){}
function fz(v){ return Math.max(1, Math.round(v * zoom / 100)); }
var _zoomTimer = null;
function onZoomChange(){
  var sl = document.getElementById("zoomSlider");
  zoom = sl ? parseInt(sl.value, 10) : 100;
  if(isNaN(zoom) || zoom < 1) zoom = 100;
  try { localStorage.setItem("zoom_capital", zoom); } catch(e){}
  document.documentElement.style.setProperty("--zoom", zoom / 100);
  var zl = document.getElementById("zoomVal");
  if(zl) zl.textContent = zoom + "%";
  if(_zoomTimer) clearTimeout(_zoomTimer);
  _zoomTimer = setTimeout(function(){ chart_s(); }, 150);
}

// 窗口尺寸变化时，让两个图表自适应重绘（只注册一次）
window.addEventListener("resize", function () {
  if (chartS) chartS.resize();
  if (chartF) chartF.resize();
});

// 容器尺寸变化（含 flex 换行导致的尺寸改变）时立即重绘画布，避免堆叠后出现空白
if (window.ResizeObserver) {
  var ro = new ResizeObserver(function () {
    if (chartS) chartS.resize();
    if (chartF) chartF.resize();
  });
  ro.observe(document.getElementById("main"));
  ro.observe(document.getElementById("main1"));
}

// ===== 置顶切换 =====
function toggleTop(){
  onTop = !onTop;
  var btn = document.getElementById("topBtn");
  btn.textContent = onTop ? "置顶" : "未置顶";
  btn.className = "btn" + (onTop ? " active" : "");
  if(window.pywebview && window.pywebview.api && window.pywebview.api.set_on_top){
    window.pywebview.api.set_on_top(onTop);
  } else {
    onTop = true;
    btn.textContent = "置顶";
    btn.className = "btn active";
  }
}

// ===== 手动刷新（工具栏按钮）=====
// 用途：窗口在隐藏/零尺寸状态下初始化时 ECharts 会画不出内容；或首屏期指行情未及时返回导致空白。
// 点一下即重新拉取四个合约分时并完整重绘两块图。
function manualRefresh(){
  var btn = document.getElementById("refreshBtn");
  if (btn) { btn.disabled = true; btn.textContent = "刷新中…"; }
  chart_s(function (ok, missing) {
    if (btn) { btn.disabled = false; btn.textContent = "刷新"; }
    if (!ok) {
      console.warn("期指分时数据未就绪，缺失:", missing);
      var el = document.getElementById("updated");
      if (el) el.textContent = "行情未就绪，点「刷新」重试";
      // 数据虽未到，仍强制重算一次画布尺寸，避免容器尺寸变化后残留空白
      try { if (chartS) chartS.resize(); } catch (e) {}
      try { if (chartF) chartF.resize(); } catch (e) {}
      return;
    }
    // 渲染完成后再补一次 resize，兜住"初始化时容器尺寸尚为 0"的情况
    setTimeout(function(){
      try { if (chartS) chartS.resize(); } catch (e) {}
      try { if (chartF) chartF.resize(); } catch (e) {}
    }, 60);
  });
}

// ===== 交易时段判断 =====
function checkAuditTime(beginTime, endTime) {
  var nowDate = new Date();
  var beginDate = new Date(nowDate);
  var endDate = new Date(nowDate);

  var beginIndex = beginTime.lastIndexOf(":");
  var beginHour = beginTime.substring(0, beginIndex);
  var beginMinue = beginTime.substring(beginIndex + 1, beginTime.length);
  beginDate.setHours(beginHour, beginMinue, 0, 0);

  var endIndex = endTime.lastIndexOf(":");
  var endHour = endTime.substring(0, endIndex);
  var endMinue = endTime.substring(endIndex + 1, endTime.length);
  endDate.setHours(endHour, endMinue, 0, 0);
  return nowDate.getTime() - beginDate.getTime() >= 0 && nowDate.getTime() <= endDate.getTime();
}

// ===== 期指行情（与监控看盘「分时看盘」同源：扩展行情 pytdx /futures/exquote/minute）=====
// 不再走新浪 JSONP：改用后端 /futures/exquote/minute/<code>（CFFEX 当月连续合约 IH/IF/IC/IM），
// 与 futures.html 分时看盘完全一致的数据源；昨收由 /futures/snapshot 提供。
// 4 个合约映射：图例顺序 ih/if/ic/im → 连续合约代码（与监控看板 FUTURES 一致）
var _RT_CODES = { ih: 'IHL9', if: 'IFL9', ic: 'ICL9', im: 'IML9' };
var _RT_LEGS = ['ih', 'if', 'ic', 'im'];   // 图例顺序
var _rtSeq = 0;        // 渲染轮次序号：新一轮开始时，上一轮的回调直接作废
var _rtTimer = null;

// ===== 共享时间轴（以资金为准）=====
// 与资金图完全一致：09:30–11:30 + 13:01–15:00（午休缺口已体现在刻度中，共 241 个分钟刻度）。
// 期指行情图与资金图共用此轴，保证两图 x 轴刻度、分割线完全对齐。
function _buildTimeAxis(){
  var ax = [];
  function pushRange(sH, sM, eH, eM){
    var h = sH, m = sM;
    while (h < eH || (h === eH && m <= eM)){
      ax.push((h < 10 ? '0' + h : '' + h) + ':' + (m < 10 ? '0' + m : '' + m));
      m++; if (m === 60){ m = 0; h++; }
    }
  }
  pushRange(9, 30, 11, 30);
  pushRange(13, 1, 15, 0);
  return ax;
}
var _TIME_AXIS = _buildTimeAxis();
var _ML_IX = [60, 120, 180, 240];   // 分割线索引：10:30 / 11:30 / 14:00 / 15:00（与资金图一致）

// readdata1（新浪 JSONP 分时）已废弃：期指行情改走扩展行情 /futures/exquote/minute（见 chart_s）。

// ===== 图表实例复用：避免反复 echarts.init 触发 "chart instance already initialized" 警告，
// 也保证刷新时能拿到已存在的实例做增量重绘（容器零尺寸初始化后，resize() 即可正常画出）=====
function _chartFor(domId){
  var dom = document.getElementById(domId);
  if (!dom) return null;
  var inst = null;
  try { inst = echarts.getInstanceByDom(dom); } catch (e) {}
  if (!inst) { inst = echarts.init(dom); }
  return inst;
}

function realdata1(prices, prePrice){
  // prices: 价格数组（可能含 null）；prePrice: 昨收。返回每根相对昨收的涨跌幅(%)
  var arr = [];
  if(!prePrice || prePrice <= 0){
    // 昨收缺失时退化为首根有效价格作基准，避免整条线为 NaN
    for (var z = 0; z < prices.length; z++){ if(prices[z] != null && isFinite(prices[z])){ prePrice = prices[z]; break; } }
  }
  for (var i = 0; i < prices.length; i++){
    var p = prices[i];
    if(p == null || !isFinite(p)){ arr.push(null); continue; }
    var ss = (p / prePrice - 1) * 100;
    arr.push(parseFloat(ss.toFixed(3)));
  }
  return arr;
}

function makechart_s(data){
  var mychart = _chartFor("main");
  if (!mychart) return null;
  var option = {
    animation: false,
    title: { text: "期指行情", textStyle: { fontSize: fz(12) } },
    tooltip: { trigger: "axis", valueFormatter: fmtTip },
    legend: { data: ["ih", "if", "ic", "im"], textStyle: { fontSize: fz(9) } },
    grid: { left: 50, right: 16, top: 36, bottom: 30 },
    xAxis: [{
      type: 'category',
      data: data.x,
      axisPointer: { show: true },
      axisLabel: { interval: 29, fontSize: fz(9) }
    }],
    yAxis: [{ type: 'value',
      min: function (v) { return Math.min(0, v.min); },
      max: function (v) { return Math.max(0, v.max); },
      axisLabel: { formatter: "{value}%", fontSize: fz(9) } }],
    series: [
      { name: "ih", type: "line", data: data.y.ih, showSymbol: false },
      { name: "if", type: "line", data: data.y.if, showSymbol: false },
      { name: "ic", type: "line", data: data.y.ic, showSymbol: false },
      { name: "im", type: "line", data: data.y.im, showSymbol: false },
      {
        name: "分割线", type: "line",
        markLine: {
          label: { show: false }, symbol: "none",
          data: [
            { xAxis: data.bb[0] }, { xAxis: data.bb[1] }, { xAxis: data.bb[2] }, { xAxis: data.bb[3] },
            { yAxis: 0, label: { show: true, formatter: "0%", position: "end", fontSize: fz(9), color: "#666" }, lineStyle: { color: "#999", width: 1.2 } }
          ]
        }
      }
    ]
  };
  mychart.setOption(option);
  try { mychart.resize(); } catch (e) {}
  chartS = mychart;
  return mychart;
}

// ===== 期指行情数据层（与监控看盘「分时看盘」同源：扩展行情 pytdx）=====
// 单合约当日分时：后端 /futures/exquote/minute/<code>（CFFEX 当月连续），返回 {ok,data:[{time,price,avg_price,vol}]}
function fetchMinute(code){
  var out = { ok: false, times: [], prices: [] };
  try {
    var url = "/futures/exquote/minute/" + encodeURIComponent(code) + "?ttl=3&_=" + Date.now();
    $.ajax({
      type: "get", async: false, timeout: 8000, url: url,
      success: function (json) {
        if (json && json.ok && json.data && json.data.length){
          var t = [], p = [];
          for (var i = 0; i < json.data.length; i++){
            t.push(json.data[i].time);
            p.push(Number(json.data[i].price));
          }
          out.times = t; out.prices = p; out.ok = true;
        }
      },
      error: function () { out.ok = false; }
    });
  } catch (e) {}
  return out;
}

// 4 合约昨收：后端 /futures/snapshot（与监控看板头部一致），返回 {code: prev_close}
function fetchPrevClose(){
  var m = {};
  try {
    $.ajax({
      type: "get", async: false, timeout: 8000, url: "/futures/snapshot?_=" + Date.now(),
      success: function (json) {
        if (json && json.ok && json.data){
          for (var i = 0; i < json.data.length; i++){
            m[json.data[i].code] = Number(json.data[i].prev_close) || 0;
          }
        }
      },
      error: function () {}
    });
  } catch (e) {}
  return m;
}

function chart_s(cb){
  _rtSeq++;
  var seq = _rtSeq;
  if (_rtTimer) { clearTimeout(_rtTimer); _rtTimer = null; }

  // 昨收：由监控看板同源的 /futures/snapshot 提供
  var prevMap = fetchPrevClose();

  // 4 合约当日分时（扩展行情 /futures/exquote/minute，与分时看盘同源）
  var fetched = {};
  var anyOk = false;
  for (var k = 0; k < _RT_LEGS.length; k++){
    var leg = _RT_LEGS[k];
    var r = fetchMinute(_RT_CODES[leg]);
    fetched[leg] = r;
    if (r.ok) anyOk = true;
  }

  // 主时间轴：以资金图为准（_TIME_AXIS = 09:30–11:30 + 13:01–15:00），两图 x 轴完全对齐
  var refAxis = _TIME_AXIS;

  if (!anyOk){
    console.warn("期指分时数据未就绪");
    // 扩展行情失败不影响资金图：仍独立重绘资金图
    try { updatechart(); } catch (e) {}
    var _el = document.getElementById("updated");
    if (_el) _el.textContent = "行情未就绪，点「刷新」重试";
    if (cb) cb(false, _RT_LEGS.slice());
    return;
  }

  var data = {};
  // 分割线：与资金图一致（10:30 / 11:30 / 14:00 / 15:00）
  data.bb = _ML_IX.map(function (i) { return refAxis[i]; });
  data.x = refAxis.slice();
  data.y = {};
  for (var k3 = 0; k3 < _RT_LEGS.length; k3++){
    var leg3 = _RT_LEGS[k3];
    var r3 = fetched[leg3];
    var pre = prevMap[_RT_CODES[leg3]] || 0;
    if (r3.ok && r3.times.length){
      // 按时间对齐到资金图时间轴（个别分钟缺失时留 null，不位移）
      var pm = {};
      for (var i = 0; i < r3.times.length; i++){
        var tk = String(r3.times[i]);
        var mm = /(\d{1,2}:\d{2})/.exec(tk);   // 兼容 "HH:MM" 与 "YYYY-MM-DD HH:MM:SS"
        if (mm) tk = mm[1];
        pm[tk] = r3.prices[i];
      }
      var arr = [];
      for (var j = 0; j < refAxis.length; j++){
        arr.push(pm.hasOwnProperty(refAxis[j]) ? pm[refAxis[j]] : null);
      }
      data.y[leg3] = realdata1(arr, pre);
    } else {
      data.y[leg3] = new Array(refAxis.length).fill(null);
    }
  }
  var f2 = makechart_s(data);
  var f1 = updatechart();
  if (f1 && f2) echarts.connect([f1, f2]);
  var el = document.getElementById("updated");
  if (el) el.textContent = "更新 " + new Date().toLocaleTimeString('zh-CN', { hour12: false });
  if (cb) cb(true, []);
}

// ===== 资金流（东方财富 fflow，经后端代理 /futures/capital/fflow）=====
function readdata(nid) {
  var gg = +new Date();
  var url = "/futures/capital/fflow?nid=" + encodeURIComponent(nid) + "&_=" + gg;
  var jdata;
  $.ajax({
    type: "get",
    async: false,
    timeout: 8000,
    url: url,
    success: function (json) {
      jdata = json;
    },
    error: function () {
      jdata = null;
    }
  });
  if (jdata && jdata.data && jdata.data.klines) {
    return jdata;
  }
  return { data: { name: "", code: "", klines: [] } };
}

function hq_deal(hqdata){
  var dict = {};
  dict.date = [];
  dict.price = [0];
  for (var i = 0; i < hqdata.length; i++){
    var tt = hqdata[i].split(",");
    dict.date.push(tt[0]);
    dict.price.push(Number(tt[1]));
  }
  return dict;
}

function chartdata(dic){
  var data1 = dic.data1.data;
  var data2 = dic.data2.data;
  var data3 = dic.data3.data;
  var data4 = dic.data4.data;

  var chartdata = {};
  var raw = [data1, data2, data3, data4];
  // 同日内复用缓存：空数据（限流/超时/502）时回退到最近一次成功序列，避免线条被清空
  var today = (new Date()).toISOString().slice(0, 10);
  if (_capCache.day !== today) {
    _capCache.day = today;
    _capCache.p = [null, null, null, null];
    _capCache.names = [null, null, null, null];
    _capCache.codes = [null, null, null, null];
  }
  var price = [];
  for (var k = 0; k < 4; k++) {
    var kl = (raw[k] && raw[k].klines) || [];
    var d = kl.length ? hq_deal(kl) : null;
    if (d && d.price.length > 1) {
      // 仅当本次更长（更完整）时才覆盖缓存，保住"最完整"的那条线
      if (!_capCache.p[k] || d.price.length >= _capCache.p[k].length) _capCache.p[k] = d.price;
      if (raw[k].name) _capCache.names[k] = raw[k].name;
      if (raw[k].code) _capCache.codes[k] = raw[k].code;
      price.push(d.price);
    } else if (_capCache.p[k]) {
      price.push(_capCache.p[k]);   // 空数据 → 用缓存兜底，线条不消失
    } else {
      price.push([0]);              // 首次且无任何数据，避免异常
    }
  }

  chartdata.date = _TIME_AXIS;   // 资金图同样以共享时间轴为准，确保与期指行情 x 轴完全一致
  chartdata.stock1price = price[0];
  chartdata.stock2price = price[1];
  chartdata.stock3price = price[2];
  chartdata.stock4price = price[3];

  chartdata.stock1name = _capCache.names[0] || data1.name || "";
  chartdata.stock2name = _capCache.names[1] || data2.name || "";
  chartdata.stock3name = _capCache.names[2] || data3.name || "";
  chartdata.stock4name = _capCache.names[3] || data4.name || "";

  chartdata.stock1code = _capCache.codes[0] || data1.code || "";
  chartdata.stock2code = _capCache.codes[1] || data2.code || "";
  chartdata.stock3code = _capCache.codes[2] || data3.code || "";
  chartdata.stock4code = _capCache.codes[3] || data4.code || "";

  return chartdata;
}

function makechart(chartdata){
  var f1 = 60, f2 = 120, f3 = 180, f4 = 240;
  var mychart = _chartFor("main1");
  if (!mychart) return null;
  var option = {
    animation: false,
    title: { text: "资金", textStyle: { fontSize: fz(12) } },
    tooltip: { trigger: "axis", valueFormatter: fmtTip },
    legend: { data: ['ih', 'if', 'ic', 'im'], textStyle: { fontSize: fz(9) } },
    grid: { left: 56, right: 16, top: 36, bottom: 30 },
    xAxis: [{
      type: 'category',
      data: chartdata.date,
      axisPointer: { show: true },
      axisLabel: { interval: 29, fontSize: fz(9) }
    }],
    yAxis: {
      type: 'value',
      name: '百万',
      nameLocation: 'end',
      axisLabel: {
        fontSize: fz(9),
        formatter: function (value) {
          return (value / 10000000000).toFixed(1);
        }
      },
      min: "dataMin",
      max: "dataMax"
    },
    series: [
      { name: "ih", type: "line", data: chartdata.stock1price, showSymbol: false },
      { name: "if", type: "line", data: chartdata.stock2price, showSymbol: false },
      { name: "ic", type: "line", data: chartdata.stock3price, showSymbol: false },
      { name: "im", type: "line", data: chartdata.stock4price, showSymbol: false },
      {
        name: "分割线", type: "line",
        markLine: {
          label: { show: false }, symbol: "none",
          data: [
            { xAxis: chartdata.date[f1] },
            { xAxis: chartdata.date[f2] },
            { xAxis: chartdata.date[f3] },
            { xAxis: chartdata.date[f4] }
          ]
        }
      }
    ]
  };
  mychart.setOption(option);
  try { mychart.resize(); } catch (e) {}
  chartF = mychart;
  return mychart;
}

function updatechart(){
  var dic = {};
  dic.data1 = readdata("1.000016");
  dic.data2 = readdata("1.000300");
  dic.data3 = readdata("1.000905");
  dic.data4 = readdata("1.000852");
  var data = chartdata(dic);
  return makechart(data);
}

// ===== 资金图独立绘制（修复「资金图表有时出现有时消失」）=====
// 资金图数据源是东方财富 fflow，与期指行情（扩展行情 /futures/exquote/minute）完全无关。
// 原先资金图只在「期指行情加载成功」的回调里才绘制；一旦期指行情请求阻塞/超时，
// updatechart() 不会被调用 → 资金图永远空白。现在资金图独立绘制，
// 不受期指行情成败影响，启动/刷新/每个刷新周期都会重绘。
function drawCapital(){
  try {
    var f = updatechart();
    // 若期指图已存在则联动（tooltip 同步）；期指图未就绪时不强求
    try { if (f && chartS) echarts.connect([f, chartS]); } catch (e) {}
    return f;
  } catch (e) {
    console.warn("资金图绘制失败：", e);
    return null;
  }
}

// ===== 启动 & 定时刷新 =====
(function(){ var sl = document.getElementById("zoomSlider"); if(sl) sl.value = zoom; var zl = document.getElementById("zoomVal"); if(zl) zl.textContent = zoom + "%"; document.documentElement.style.setProperty("--zoom", zoom / 100); })();
// 资金图独立启动（不依赖期指行情）：立即 + 下一帧各一次，确保首屏与布局稳定后都能画出来
drawCapital();
requestAnimationFrame(function(){ requestAnimationFrame(drawCapital); });

chart_s();
setInterval(function(){
  if (checkAuditTime("9:20", "11:35") || checkAuditTime("12:55", "15:10")) {
    chart_s();   // chart_s 的成功/失败分支都会绘制资金图，无需再单独调用（减少东方财富请求频次，避免触发限流）
  } else {
    console.log("闭市");
  }
}, 20000);
</script>
