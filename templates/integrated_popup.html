<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>市场概况 · 综合独立窗口</title>
<script src="https://unpkg.com/vue@2.7.16/dist/vue.min.js"></script>
<script src="/static/js/popup-launcher.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { font-family:"Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#f5f7fa; color:#303133; }
  #app { position:relative; height:100vh; display:flex; flex-direction:column; }

  /* 顶部悬浮工具栏 */
  .toolbar-hover { position:absolute; top:0; left:0; right:0; height:40px; z-index:10; }
  .popup-toolbar { position:absolute; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:6px 12px;
    background:#fff; border:1px solid #ebeef5; border-radius:0 0 8px 8px;
    box-shadow:0 2px 8px rgba(0,0,0,.1); opacity:0; pointer-events:none; transition:opacity .18s ease; }
  .toolbar-hover:hover + .popup-toolbar, .popup-toolbar:hover { opacity:1; pointer-events:auto; }

  .popup-title { font-size:15px; font-weight:700; color:#303133; }
  .popup-toolbar .muted { font-size:12px; color:#909399; white-space:nowrap; }
  .popup-toolbar-right { margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  .zoom-group { display:flex; align-items:center; gap:6px; }
  .zoom-group label { font-size:12px; color:#909399; }
  .zoom-slider { width:80px; }
  .zoom-val { font-size:12px; color:#606266; min-width:34px; text-align:right; }

  .btn { background:#fff; color:#409eff; border:1px solid #409eff; border-radius:6px;
    padding:4px 10px; font-size:12px; cursor:pointer; }
  .btn:hover { background:#ecf5ff; }
  .btn.active { background:#409eff; color:#fff; }

  /* 三列布局：左(320) 中(400) 右(1240) */
  .dashboard {
    flex:1 1 auto;
    min-height:0;
    display:flex;
    gap:8px;
    padding:8px;
    overflow:auto;
    transition:margin-top .18s ease;
  }
  .toolbar-hover:hover ~ .dashboard,
  .popup-toolbar:hover ~ .dashboard {
    margin-top:40px;
  }
  .col {
    display:flex;
    flex-direction:column;
  }
  .col-left  { width:320px; }
  .col-center { width:400px; }
  .col-right  { width:1240px; }

  .panel {
    position:relative;
    background:#fff;
    border:1px solid #ebeef5;
    border-radius:8px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
    overflow:visible;
    display:flex;
    flex-direction:column;
  }
  .panel .pbar {
    height:24px;
    min-height:24px;
    padding:0 10px;
    line-height:24px;
    font-size:11px;
    font-weight:600;
    color:#606266;
    background:#f5f6f8;
    border-bottom:1px solid #ebeef5;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .panel .pcontent {
    flex:1 1 0;
    min-height:0;
    position:relative;
    overflow:visible;
  }
  /* iframe 容器：固定宽高 (zoom 应用于容器而非 iframe 元素) */
  .frame-wrap {
    position:relative;
    overflow:visible;
    width:100%;
    height:100%;
  }
  .frame-wrap iframe {
    display:block;
    width:100%;
    height:100%;
    border:none;
  }

  /* 每个面板的确切默认高度由标题栏 + 内容区分配，frame-wrap 占满 pcontent */
  .p-amountflow { flex: 0 0 500px; }
  .p-zhangfu  { flex: 0 0 180px; }
  .p-capital  { flex: 0 0 400px; }
  .p-industry { flex: 0 0 400px; }
  .p-external { flex: 0 0 600px; }
  .p-futures  { flex: 0 0 700px; }
  .p-news     { width:410px; }
  .p-option   { width:830px; }
</style>
</head>
<body>
<div id="app">
  <div class="toolbar-hover"></div>
  <div class="popup-toolbar">
    <span class="popup-title">📊 市场概况 · 综合独立窗口</span>
    <span class="muted" v-if="updatedAt">[# updatedAt #]</span>
    <div class="zoom-group">
      <label>缩放</label>
      <input type="range" class="zoom-slider" min="50" max="150" step="1" v-model.number="zoom" @input="onZoomChange">
      <span class="zoom-val">[# zoom #]%</span>
    </div>
    <span class="popup-toolbar-right">
      <button class="btn" :class="{active:onTop}" @click="toggleTop">[# onTop ? '置顶' : '未置顶' #]</button>
      <button class="btn" @click="refreshAll">刷新全部</button>
      <button class="btn" @click="closeWin">关闭</button>
    </span>
  </div>

  <!-- 三列布局：左1列 3 面板 | 中1列 2 面板 | 右1列 3 面板 -->
  <div class="dashboard">
    <!-- 左列： amountflow → zhangfu → capital -->
    <div class="col col-left">
      <div class="panel p-amountflow">
        
        <div class="pcontent"><div class="frame-wrap">
          <iframe :src="baseUrl('amountflow')" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
        </div></div>
      </div>
      <div class="panel p-zhangfu">
        
        <div class="pcontent"><div class="frame-wrap">
          <iframe :src="baseUrl('zhangfu')" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
        </div></div>
      </div>
      <div class="panel p-capital">
        
        <div class="pcontent"><div class="frame-wrap">
          <iframe :src="baseUrl('capital')" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
        </div></div>
      </div>
    </div>

    <!-- 中列： industry → external -->
    <div class="col col-center">
      <div class="panel p-industry">
        
        <div class="pcontent"><div class="frame-wrap">
          <iframe :src="baseUrl('industry')" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
        </div></div>
      </div>
      <div class="panel p-external">
        
        <div class="pcontent"><div class="frame-wrap">
          <iframe :src="baseUrl('external')" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
        </div></div>
      </div>
    </div>

    <!-- 右列： futures → (news + option) -->
    <div class="col col-right">
      <div class="panel p-futures">
        
        <div class="pcontent"><div class="frame-wrap">
          <iframe :src="baseUrl('futures')" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
        </div></div>
      </div>
      <div style="display:flex; gap:0; flex:1 1 0; min-height:0;">
        <div class="panel p-news">
          
          <div class="pcontent"><div class="frame-wrap">
            <iframe :src="baseUrl('news')" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
          </div></div>
        </div>
        <div class="panel p-option">
          
          <div class="pcontent"><div class="frame-wrap">
            <iframe :src="baseUrl('option')" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
          </div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
new Vue({
  el: '#app',
  delimiters: ['[#', '#]'],
  data: {
    baseUrls: {
      amountflow: '/futures/amountflow/popup',
      industry:   '/futures/industry/popup',
      futures:    '/futures/popup',
      zhangfu:    '/futures/zhangfu/popup',
      external:   '/futures/external/popup',
      news:       '/futures/news/popup',
      option:     '/option/popup',
      capital:    '/futures/capital/popup',
    },
    zoom: (function(){ try{ var v = parseInt(localStorage.getItem('zoom_integrated') || '100', 10); return (isFinite(v) && v >= 50 && v <= 150) ? v : 100; }catch(e){ return 100; } })(),
    onTop: true,
    updatedAt: '',
  },
  created() {
    this.applyZoom();
  },
  mounted() {
    this.updatedAt = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  },
  methods: {
    baseUrl(key) {
      var base = this.baseUrls[key] || '/';
      return base + '?_t=' + Date.now();
    },
    applyZoom() {
      var scale = this.zoom / 100;
      var wraps = document.querySelectorAll('.frame-wrap');
      wraps.forEach(function(w) {
        w.style.zoom = (scale === 1) ? '' : scale;
      });
    },
    onZoomChange() {
      try { localStorage.setItem('zoom_integrated', this.zoom); } catch(e) {}
      this.applyZoom();
    },
    toggleTop() {
      this.onTop = !this.onTop;
      if (window.pywebview && window.pywebview.api && window.pywebview.api.set_on_top) {
        window.pywebview.api.set_on_top(this.onTop);
      } else {
        this.onTop = true;
      }
    },
    refreshAll() {
      var frames = document.querySelectorAll('.frame-wrap iframe');
      frames.forEach(function(iframe, i) {
        var base = iframe.src.split('?_t=')[0];
        iframe.src = base + '?_t=' + (Date.now() + i);
      });
      this.updatedAt = '刷新全部 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
    },
    closeWin() {
      try { window.close(); } catch(e) {}
    },
  },
});
</script>
</body>
</html>
