<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" role="img">
  <title>dev_z 历史数据 脉络图</title>
  <desc>dev_z 历史数据主干：来源（实时缓存 + 深历史）→ 基线（不足则从国元回补补齐后算 mu/sd）→ 当日每根 dev_z 输出</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5F5E5A"/>
    </marker>
    <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/>
    </marker>
  </defs>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#2C2C2A">
    <!-- ROOT -->
    <rect x="280" y="22" width="200" height="46" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.6"/>
    <text x="380" y="50" text-anchor="middle" font-weight="500" fill="#26215C">dev_z 历史数据</text>
    <!-- SRC -->
    <rect x="120" y="108" width="180" height="44" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
    <text x="210" y="135" text-anchor="middle" font-weight="500" fill="#444441">两条历史来源</text>
    <!-- LIVE -->
    <rect x="20" y="199" width="180" height="52" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/>
    <text x="110" y="221" text-anchor="middle" font-weight="500" fill="#444441">实时缓存 ≤30天</text>
    <text x="110" y="239" text-anchor="middle" font-size="11" fill="#444441">当日 feats + 本地 ATR5</text>
    <!-- DEEP -->
    <rect x="220" y="199" width="200" height="52" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
    <text x="320" y="221" text-anchor="middle" font-weight="500" fill="#0C447C">深历史 vwap_hist/*.pkl</text>
    <text x="320" y="239" text-anchor="middle" font-size="11" fill="#0C447C">灾备 backup/*_max.pkl</text>
    <!-- CHK diamond -->
    <path d="M320 290 L395 325 L320 360 L245 325 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
    <text x="320" y="322" text-anchor="middle" font-size="12" font-weight="500" fill="#412402">齐备 ≥277日?</text>
    <!-- GY -->
    <rect x="485" y="310" width="190" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
    <text x="580" y="333" text-anchor="middle" font-weight="500" fill="#04342C">国元回补</text>
    <text x="580" y="350" text-anchor="middle" font-size="11" fill="#04342C">restore并集 + 拉深历史</text>
    <text x="580" y="367" text-anchor="middle" font-size="11" fill="#04342C">填补 → 写缓存</text>
    <!-- BASE -->
    <rect x="180" y="413" width="240" height="54" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
    <text x="300" y="435" text-anchor="middle" font-weight="500" fill="#0C447C">基线 mu/sd (按 pos 0..239)</text>
    <text x="300" y="453" text-anchor="middle" font-size="11" fill="#0C447C">exclude_last = True</text>
    <!-- CACHE -->
    <rect x="185" y="512" width="230" height="46" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/>
    <text x="300" y="539" text-anchor="middle" font-weight="500" fill="#444441">进程内缓存 (按天一次)</text>
    <!-- OUT -->
    <rect x="470" y="505" width="220" height="60" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
    <text x="580" y="530" text-anchor="middle" font-weight="500" fill="#04342C">当日 dev_z 输出</text>
    <text x="580" y="549" text-anchor="middle" font-size="11" fill="#04342C">dev_z=(dev_atr−mu[pos])/sd[pos]</text>

    <!-- arrows -->
    <line x1="330" y1="68" x2="252" y2="106" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="170" y1="152" x2="132" y2="197" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="252" y1="152" x2="300" y2="197" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="320" y1="251" x2="320" y2="288" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="395" y1="325" x2="483" y2="345" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="425" y="318" font-size="11" fill="#5F5E5A">否</text>
    <line x1="320" y1="360" x2="300" y2="411" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="333" y="388" font-size="11" fill="#0F6E56" font-weight="500">是</text>
    <line x1="485" y1="372" x2="423" y2="432" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ard)"/>
    <text x="492" y="408" font-size="10.5" fill="#0F6E56">补齐后重算</text>
    <line x1="185" y1="251" x2="206" y2="411" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="118" y="340" font-size="10.5" fill="#5F5E5A">当日+最新日</text>
    <line x1="300" y1="467" x2="300" y2="510" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="415" y1="535" x2="468" y2="535" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
</svg>
